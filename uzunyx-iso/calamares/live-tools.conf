# /etc/live/tools.conf of the live session, read by live-medium-eject (live-tools).
# On shutdown it ejects the medium and waits for Enter, but it asks from
# systemd-shutdown, after Plymouth has been stopped: the question went to the
# text console, hidden behind the splash, and the machine seemed hung. It still
# ejects (a DVD or a VM's drive opens; USB sticks it leaves alone), without asking.
LIVE_MEDIUM_EJECT_VERBOSE=false
