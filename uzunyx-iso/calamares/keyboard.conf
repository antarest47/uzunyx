# Calamares' keyboard page, first after the welcome (customize-hook.sh). It
# starts on the live session's layout, the one of the boot menu (latam in
# Spanish, us in English), instead of guessing it from the language: with
# es_UY it guessed es, Spain's. The rest as Calamares' own.
---
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath: "/lib/kbd/keymaps/xkb"
guessLayout: false
configure:
    kwin: false
    gnome: false
