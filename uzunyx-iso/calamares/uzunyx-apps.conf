# "Aplicaciones" page (packagechooserq@apps): the choice goes to Global Storage
# as packagechooser_apps ("default" or "extended"), which
# uzunyx-install-apps.conf reads at the end of the installation.
---
qmlSearch: both
qmlFilename: uzunyx-apps
mode: required
method: legacy
id: apps
labels:
    step: "Aplicaciones"
items:
    - id: default
      name: "Instalación por defecto"
    - id: extended
      name: "Selección ampliada"
