set timeout=5
set default=0
insmod all_video
insmod gfxterm
insmod png
if loadfont /boot/grub/themes/uzunyx/noto-sans-16.pf2; then true; fi
set gfxmode=auto
terminal_output gfxterm
set theme=/boot/grub/themes/uzunyx/theme.txt

set common="boot=live components quiet splash username=uzunyx hostname=uzunyx"

menuentry "Probar o instalar Uzunyx" {
    linux /live/vmlinuz $common locales=es_UY.UTF-8 keyboard-layouts=latam
    initrd /live/initrd.img
}
menuentry "Try or install Uzunyx (English)" {
    linux /live/vmlinuz $common locales=en_US.UTF-8 keyboard-layouts=us
    initrd /live/initrd.img
}
menuentry "Modo seguro (sin aceleración de vídeo)" {
    linux /live/vmlinuz boot=live components username=uzunyx hostname=uzunyx nomodeset locales=es_UY.UTF-8 keyboard-layouts=latam
    initrd /live/initrd.img
}
