# Uzunyx (uzunyx-plymouth): show the boot splash. Adds "splash" to the
# kernel command line unless it is already there; /etc/default/grub is left
# alone. Takes effect after update-grub (the package runs it).
case " $GRUB_CMDLINE_LINUX_DEFAULT " in
    *" splash "*) ;;
    *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }splash" ;;
esac
