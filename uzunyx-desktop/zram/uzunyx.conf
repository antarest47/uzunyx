# Uzunyx (uzunyx-desktop): compressed swap in RAM, used before the swap file
# the installer makes (that one has a lower priority), so memory filling up
# goes to RAM first and only to the disk when it isn't enough. Half the RAM,
# 8 GiB at most; zstd packs about 3 to 1. Override in
# /etc/systemd/zram-generator.conf.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
