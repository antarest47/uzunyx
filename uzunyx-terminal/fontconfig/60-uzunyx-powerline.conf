<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The round Powerline ends of the Starship prompt (uzunyx-terminal) come from
     "Uzunyx Powerline", made to Hack's cell, before any other fallback font. -->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>Hack</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>Uzunyx Powerline</string>
    </edit>
  </match>
</fontconfig>
