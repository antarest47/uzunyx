# Login screen on Wayland, with KWin: with Xorg, switching user could hang the lock
# screen, both fighting for the display. The file sorts after uzunyx.conf and repeats
# its GreeterEnvironment. Without this file SDDM goes back to Xorg.
[General]
DisplayServer=wayland
GreeterEnvironment=QT_QPA_PLATFORMTHEME=kde,QT_WAYLAND_SHELL_INTEGRATION=layer-shell,XDG_CONFIG_DIRS=/usr/share/sddm/themes/uzunyx/colors/current:/usr/share/sddm/themes/uzunyx/colors/akane:/etc/xdg

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
