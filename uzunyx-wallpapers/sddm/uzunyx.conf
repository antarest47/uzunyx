# Login screen theme (installed by uzunyx-wallpapers): KDE's Breeze SDDM
# theme with the Uzunyx background.
[General]
# The greeter's user has no settings: read /etc/xdg/kdeglobals (Nunito, icons)
# and the colors of the edition (colors/current is uzunyx-edition --sddm's choice).
GreeterEnvironment=QT_QPA_PLATFORMTHEME=kde,XDG_CONFIG_DIRS=/usr/share/sddm/themes/uzunyx/colors/current:/usr/share/sddm/themes/uzunyx/colors/akane:/etc/xdg

[Theme]
Current=uzunyx
Font=Nunito,10
