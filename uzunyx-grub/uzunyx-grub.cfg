# Uzunyx (uzunyx-grub): GRUB theme and a hidden menu, like Ubuntu or Linux
# Mint. Sourced by grub-mkconfig after /etc/default/grub, so it wins over
# it; to change it, add a file that sorts after this one (e.g. zz-local.cfg).

# The package's postinst copies the theme to /boot, which GRUB can always
# read (unlike /usr on an encrypted root).
if [ -f /boot/grub/themes/uzunyx/theme.txt ]; then
    GRUB_THEME=/boot/grub/themes/uzunyx/theme.txt
    # The palette's background behind the hidden menu and the console too,
    # instead of desktop-base's blue picture.
    GRUB_BACKGROUND=/boot/grub/themes/uzunyx/background.png
fi

# Hidden menu: one second to press Esc (or F4, or hold Shift) to show it.
# Unless os-prober is enabled (Debian disables it), which means there are
# other systems to choose from: then the menu shows as usual.
if [ "${GRUB_DISABLE_OS_PROBER:-true}" = true ]; then
    GRUB_TIMEOUT_STYLE=hidden
    GRUB_TIMEOUT=1
fi
